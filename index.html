<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#132e43">
  <title>解謎領紅包</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#152c3d;background:#eef3f7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(100%,580px);background:white;border-radius:24px;padding:clamp(24px,5vw,40px);box-shadow:0 18px 50px #16314719}
    .tag{display:inline-block;background:#d9f2ed;color:#075e4b;border-radius:50px;padding:6px 12px;font-size:.8rem;font-weight:700}
    h1{margin:15px 0 6px;font-size:clamp(1.5rem,5vw,2rem)}.sub{color:#647583;margin:0 0 26px}
    .top{display:flex;justify-content:space-between;align-items:center;color:#526475;font-size:.9rem}
    .track{height:9px;background:#e9eff3;border-radius:20px;overflow:hidden;margin:12px 0 28px}
    .bar{height:100%;background:#16a88b;width:0%;transition:width .25s}
    h2{font-size:1.3rem;line-height:1.55;margin:0 0 18px}
    .answers{display:grid;gap:11px}.choice{display:flex;align-items:center;text-align:left;width:100%;padding:15px 16px;border-radius:13px;border:1.5px solid #d8e2e9;background:white;color:#152c3d;font:inherit;cursor:pointer;transition:.15s}
    .choice:hover:not(:disabled){border-color:#138d77;background:#f4fcfa}.choice.selected{border-color:#138d77;background:#e7f7f3}.choice:disabled{cursor:default;opacity:.7}
    .letter{display:inline-grid;place-items:center;border:1px solid #ccd9e0;border-radius:8px;min-width:31px;height:31px;margin-right:14px;font-weight:700}
    .primary{width:100%;border:0;border-radius:12px;background:#087d68;color:white;font:inherit;font-weight:750;padding:15px;margin-top:18px;cursor:pointer}
    .primary:disabled{background:#b8c5cb;cursor:not-allowed}.notice{padding:14px;border-radius:12px;margin-top:16px;line-height:1.5}
    .wrong{background:#fff1f0;color:#a12a28}.right{background:#e4f6ed;color:#14683c}
    .hidden{display:none}.finish{text-align:center;padding:22px 0}.finish .emoji{font-size:3rem}.finish h2{margin:10px 0}
    button:focus-visible{outline:3px solid #54b6eb;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <span class="tag">解謎領紅包</span>
    <h1>闖關挑戰</h1>
    <p class="sub">答對才能繼續，答錯可無限重試！</p>
    <section id="quiz">
      <div class="top"><strong id="number"></strong><span id="attempts"></span></div>
      <div class="track" aria-hidden="true"><div class="bar" id="progress"></div></div>
      <h2 id="question"></h2>
      <div id="answers" class="answers" role="group" aria-label="請選擇答案"></div>
      <div id="feedback" class="notice hidden" role="status" aria-live="polite"></div>
      <button id="action" class="primary" disabled>請先選擇答案</button>
    </section>
    <section id="finish" class="finish hidden" aria-live="polite">
      <div class="emoji" aria-hidden="true">🏆</div><h2>恭喜闖關成功！</h2>
      <p>你已經答對全部題目，完成挑戰！媽媽紅包就在~~哥哥書桌左邊抽屜裡。</p>
      <p id="summary"></p>
      <button id="restart" class="primary">再挑戰一次</button>
    </section>
  </main>
  <script>
    // 只要修改這裡，就可以換成自己的題目。answer 為正確選項索引，從 0 開始。
    const questions = [
      {question:"爸爸的出生年月日？", options:["1969.1.1","1972.11.26","1980.12.27","1982.11.26"], answer:2},
      {question:"爸爸最喜歡吃的東西？", options:["豆腐鍋","燒烤","滷味","牛排"], answer:1},
      {question:"天下最漂亮的人是誰？", options:["李多慧","野原美冴","冰雪奇緣艾莎","媽媽"], answer:3}
    ];

    const $ = id => document.getElementById(id);
    let index=0, selected=-1, mistakes=0, state='choose';
    function render(){
      const q=questions[index];selected=-1;state='choose';
      $('number').textContent=`第 ${index+1} / ${questions.length} 題`;
      $('attempts').textContent=`已重試 ${mistakes} 次`;
      $('progress').style.width=`${index/questions.length*100}%`;
      $('question').textContent=q.question;
      $('feedback').className='notice hidden';$('feedback').textContent='';
      $('answers').replaceChildren();
      q.options.forEach((option,i)=>{
        const button=document.createElement('button');button.type='button';button.className='choice';
        const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+i);
        const content=document.createElement('span');content.textContent=option;
        button.append(letter,content);
        button.addEventListener('click',()=>{
          if(state!=='choose')return;
          selected=i;
          [...$('answers').children].forEach((el,j)=>el.classList.toggle('selected',j===i));
          $('action').disabled=false;$('action').textContent='確認答案';
        });
        $('answers').append(button);
      });
      $('action').disabled=true;$('action').textContent='請先選擇答案';
    }
    $('action').addEventListener('click',()=>{
      if(state==='right'){
        index++;
        if(index===questions.length){
          $('quiz').classList.add('hidden');$('finish').classList.remove('hidden');
          $('summary').textContent=`總共重試 ${mistakes} 次。`;
        }else render();
        return;
      }
      if(state==='wrong'){render();return;}
      if(selected<0)return;
      if(selected===questions[index].answer){
        state='right';$('feedback').className='notice right';$('feedback').textContent='✅ 答對了！可以進入下一題。';
        $('action').textContent=index===questions.length-1?'完成挑戰':'下一題';
      }else{
        mistakes++;state='wrong';$('feedback').className='notice wrong';
        $('feedback').textContent='❌ 答錯了，請再試一次。本題必須答對才能繼續。';
        $('action').textContent='重新作答';$('attempts').textContent=`已重試 ${mistakes} 次`;
      }
      [...$('answers').children].forEach(button=>button.disabled=true);
    });
    $('restart').addEventListener('click',()=>{
      index=0;mistakes=0;$('finish').classList.add('hidden');$('quiz').classList.remove('hidden');render();
    });
    render();
  </script>
</body>
</html>
